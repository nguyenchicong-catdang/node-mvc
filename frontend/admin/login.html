<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        form {
            display: grid;
            width: 50%;
            margin: auto;
            padding-top: 100px;
            text-align: center;
            gap: 10px;
        }
        input {
            font-size: larger;
        }
        button {
            font-size: large;
        }
    </style>
</head>
<body>
    <form>
        <h1>Login</h1>
        <input type="text" name="username" placeholder="User Name" autocomplete="username">
        <input type="text" name="password" placeholder="Password" autocomplete="new-password">
        <button type="submit">Login</button>
    </form>
    <script type="module" src="./login/login.js"></script>
</body>
</html>
