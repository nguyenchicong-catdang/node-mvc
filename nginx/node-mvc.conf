server {
    listen 80;
    server_name localhost;

    root /workspaces/node-mvc/public;
    index index.html index.htm;

    # Proxy các API routes cụ thể đến Node.js
    location /auth/login {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/admin/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Phục vụ các tệp tĩnh trực tiếp (CSS, JS, images, v.v.)
    location ~* \.(css|js|jpg|jpeg|gif|png|ico|woff|woff2|ttf|eot|svg)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Bắt tất cả các yêu cầu còn lại.
    # Nginx sẽ cố gắng tìm tệp tĩnh, nếu không thấy thì chuyển hướng đến Node.js.
    location / {
        try_files $uri $uri/ /index.html @nodejs;
    }

    # Named location để proxy đến Node.js, giúp cấu hình location / gọn gàng hơn
    location @nodejs {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}