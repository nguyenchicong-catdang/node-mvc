# nginx/node-mvc.conf
# /etc/nginx/sites-available/node-app
server {
    listen 80;
    #listen [::]:80;
    server_name localhost;
    root /workspaces/node-mvc/public;
    index index.html index.htm;

    location ~* \.(css|js|jpg|jpeg|gif|png|ico|woff|woff2|ttf|eot)$ {
        # The try_files directive will look for the file in the root directory.
        try_files $uri =404;
    }

    # Phục vụ tệp tin login.html từ đường dẫn /admin/login
    # location /admin/login/ {
    #     root /workspaces/node-mvc/frontend/admin/;
    #     index login.html;
    # }
    # This is not a good practice, but it would work
    location /admin/login/ {
        #root /workspaces/node-mvc/frontend/;
        # Attempts to serve login.html, otherwise returns a 404
        #try_files /admin/login.html =404;
        #login.html;
        /admin/login.html;
    }

    # location / {
    #     try_files $uri $uri/ = 404;
    # }
    # Phục vụ các tệp tĩnh khác
    # location ~* \.(css|js|jpg|jpeg|gif|png|ico|woff|woff2|ttf|eot)$ {
    #     expires 30d;
    #     add_header Cache-Control "public";
    # }

    # Chuyển hướng các yêu cầu còn lại đến ứng dụng Node.js
    # location / {
    #     proxy_pass http://localhost:5173;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    # }
    # Chuyển hướng các yêu cầu còn lại đến ứng dụng Node.js
    location / {
        #try_files $uri $uri/ = 404;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
