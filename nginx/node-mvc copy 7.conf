# nginx/node-mvc.conf
# /etc/nginx/sites-available/node-app
server {
    listen 80;
    server_name localhost;

    # Set the root directory for serving static files.
    # This is where your Vite build output (e.g., in `public/`) will be served from.
    root /workspaces/node-mvc/public; 
    index index.html index.htm; # Default index files for directories

    # --- Step 1: Handle requests for specific static HTML pages ---
    # If Vite builds `login.html` into `public/admin/login.html`,
    # this block would serve `public/admin/login.html` for `/admin/login/`.
    # location /admin/login/ {
    #     # 'root' directive specifies the base directory for files within THIS location block.
    #     # If your login.html is at /workspaces/node-mvc/public/admin/login.html,
    #     # then this root would be /workspaces/node-mvc/public/admin/
    #     # However, since `root` is already defined above, and if Vite places `login.html`
    #     # correctly in `public/`, then the main `root` often suffices with `try_files`.
    #     # Let's try to serve it directly from the main root.
    #     try_files /admin/login.html =404;
    #     # Simplified: If user requests /admin/login/, Nginx will look for 
    #     # /workspaces/node-mvc/public/admin/login.html.
    #     # This assumes your Vite build outputs it as public/admin/login.html
    # }


    # --- Step 2: Proxy specific API routes to your Node.js backend ---
    # These routes are specifically handled by your Node.js application (backend)
    location /auth/login {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/admin/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # --- Step 3: Serve other static files directly (CSS, JS, images etc.) ---
    # This location block uses a regex to match common static file extensions.
    # Nginx will look for these files in the `root` directory (`/workspaces/node-mvc/public`).
    location ~* \.(css|js|jpg|jpeg|gif|png|ico|woff|woff2|ttf|eot|svg)$ {
        #try_files $uri =404;
        try_files $uri $uri/ = 404;
        # Optional: Add caching headers for static files
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # --- Step 4: Catch-all for all other requests (proxy to Node.js) ---
    # Any request that hasn't been matched by the above `location` blocks
    # (i.e., not a specific HTML page or a static file) will be proxied to Node.js.
    # This includes your other dynamic backend routes.
    location / {
        #try_files $uri $uri/ = 404;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # location /node/ {
    # rewrite /node/(.*)  /$1 break;
    # proxy_pass http://localhost:3000;
}
